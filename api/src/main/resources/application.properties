# ---------- Conexión a MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/aracnido_store?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root

# La contraseña real NO va en este archivo. Va en
# application-local.properties, que está en el .gitignore y se importa
# acá abajo.
spring.datasource.password=
spring.config.import=optional:classpath:application-local.properties

# ---------- Hibernate / JPA ----------
# "update": crea las tablas que falten y agrega columnas nuevas, pero
# nunca borra datos existentes.
spring.jpa.hibernate.ddl-auto=update

# Muestra por consola el SQL que genera Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Puerto del servidor ----------
# Puerto de la API (http://localhost:8080).
server.port=8080

# ---------- Reglas de la tienda ----------
# Stock mínimo: por debajo (o igual) se considera "stock bajo". Lo usa
# GET /api/productos/stock-bajo y la alerta por consola al crear pedidos.
aracnido.stock.minimo=5

# ---------- CORS (frontend) ----------
# Orígenes desde los que el navegador puede llamar a la API, separados por
# coma. 5500 = extensión Live Server de VS Code, 3000/5173 = servidores de
# desarrollo habituales (React, Vite).
aracnido.cors.origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173
