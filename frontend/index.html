<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arácnido Store · Sistema de Gestión</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <div class="masthead-row">
      <div class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
            <circle cx="32" cy="28" r="10"/>
            <path d="M32 38v14M14 20l10 8M50 20l-10 8M10 30l12 3M54 30l-12 3M12 42l12-5M52 42l-12-5"/>
          </svg>
        </span>
        <div>
          <h1>ARÁCNIDO <span class="accent">STORE</span></h1>
          <div class="sub">Sistema de Gestión — Catálogo &amp; Pedidos</div>
        </div>
      </div>
      <div class="masthead-meta">
        <div>usuario activo: <span class="user" id="usuario-label"></span></div>
        <div class="meta-actions">
          <button class="theme-toggle" id="theme-toggle-btn" data-action="theme-toggle" title="Cambiar tema" aria-label="Cambiar entre modo claro y oscuro">🌙</button>
          <button class="cart-pill" data-action="nav" data-vista="carrito">
            🕸️ carrito <span class="badge" id="cart-badge">0</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <nav class="menu" id="main-menu"></nav>

  <main id="app"></main>
</div>

<footer>Arácnido Store · gestión de productos y pedidos · inspirado en la nueva película de spider-man</footer>

<div class="toast-host" id="toast-host"></div>

<script src="js/models.js"></script>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/theme.js"></script>

<script src="js/render/core.js"></script>
<script src="js/render/productos.js"></script>
<script src="js/render/categorias.js"></script>
<script src="js/render/carrito.js"></script>
<script src="js/render/pedidos.js"></script>
<script src="js/render/admin.js"></script>

<script src="js/events.js"></script>
<script src="js/main.js"></script>
</body>
</html>
